name: GLaDOS Daily Checkin
on:
  schedule:
    # 每天北京时间 0:05 触发（UTC 16:05）
    - cron: '25 16 * * *'
  workflow_dispatch:   # 支持手动触发
jobs:
  checkin:
    runs-on: ubuntu-latest
    outputs:
      log_content: ${{ steps.run_checkin.outputs.log }}
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install requests
      - name: Run checkin
        id: run_checkin
        env:
          GLADOS_CONFIG: ${{ secrets.GLADOS_CONFIG }}
          GLADOS_COOKIES: ${{ secrets.GLADOS_COOKIES }}
          GLADOS_COOKIE: ${{ secrets.GLADOS_COOKIE }}
          GLADOS_EXCHANGE_PLAN: ${{ secrets.GLADOS_EXCHANGE_PLAN }}
        run: |
          set +e
          LOG=$(python GLaDOS_Checkin.py 2>&1)
          echo "$LOG"
          echo "log<<EOF" >> $GITHUB_OUTPUT
          echo "$LOG" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
      - name: Send DingTalk notify
        env:
          DING_WEBHOOK: ${{ secrets.DING_WEBHOOK }}
        if: env.DING_WEBHOOK != ''
        run: |
          curl -s -X POST "${DING_WEBHOOK}" \
          -H "Content-Type:application/json" \
          -d '{
            "msgtype": "text",
            "text": {
              "content": "# GLaDOS签到任务\n${{ steps.run_checkin.outputs.log }}"
            }
          }'
  keepalive:
    runs-on: ubuntu-latest
    needs: checkin   # 等签到完成后再执行保活
    if: always()
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Check if today is 8, 18, or 28
        id: date_check
        run: |
          # 获取当前北京时间的日期（UTC+8）
          DAY=$(TZ='Asia/Shanghai' date +%d)
          if [[ "$DAY" == "08" || "$DAY" == "18" || "$DAY" == "28" ]]; then
            echo "should_run=true" >> $GITHUB_OUTPUT
          else
            echo "should_run=false" >> $GITHUB_OUTPUT
          fi
      - name: Update keepalive file
        if: steps.date_check.outputs.should_run == 'true'
        run: |
          echo "Last kept alive at $(TZ='Asia/Shanghai' date '+%Y-%m-%d %H:%M:%S')" > keepalive.txt
      - name: Commit and push
        if: steps.date_check.outputs.should_run == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add keepalive.txt
          git diff --quiet && git diff --staged --quiet || git commit -m "chore: keepalive on $(TZ='Asia/Shanghai' date +%Y%m%d)"
          git push
